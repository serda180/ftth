name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  base-de-datos:
    name: Migraciones y pruebas de base de datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Levantar Postgres con migraciones y seed
        run: supabase db start
      - name: Pruebas pgTAP
        run: supabase test db

  frontend:
    name: Frontend (tipos, pruebas y compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
